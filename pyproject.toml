[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ios-test-generator-agent"
version = "1.0.1"
description = "Production-ready AI agent that analyzes iOS projects and generates comprehensive XCTest unit test cases automatically"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "iOS Test Generator Team", email = "support@ios-test-gen.dev"}
]
maintainers = [
    {name = "iOS Test Generator Team", email = "support@ios-test-gen.dev"}
]
keywords = [
    "ios", "swift", "testing", "xctest", "unit-tests",
    "test-generation", "ai", "llm", "code-analysis"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

dependencies = [
    "openai>=1.0.0,<2.0.0",
    "anthropic>=0.30.0,<1.0.0",
    "groq>=0.4.0,<1.0.0",
    "click>=8.0.0,<9.0.0",
    "rich>=13.0.0,<14.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
    "tenacity>=8.0.0,<9.0.0",  # For retry logic
    "python-dotenv>=1.0.0,<2.0.0",  # For .env file support
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-pyyaml",
]

[project.urls]
Homepage = "https://github.com/yourusername/ios-test-generator-agent"
Documentation = "https://ios-test-generator-agent.readthedocs.io"
Repository = "https://github.com/yourusername/ios-test-generator-agent"
"Bug Tracker" = "https://github.com/yourusername/ios-test-generator-agent/issues"
Changelog = "https://github.com/yourusername/ios-test-generator-agent/blob/main/CHANGELOG.md"

[project.scripts]
ios-test-gen = "ios_test_generator_agent.cli:cli"

[tool.hatch.version]
path = "ios_test_generator_agent/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/ios_test_generator_agent",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.hatch.build.targets.wheel]
packages = ["ios_test_generator_agent"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
force-exclude = '''
/(
    \.git
  | \.venv
  | \.eggs
  | \.tox
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise from within except (we handle this intentionally)
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=ios_test_generator_agent",
    "--cov-report=term-missing",
    "--cov-report=html",
]